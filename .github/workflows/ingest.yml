name: Scheduled Ingestion Pipeline

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Caching pip dependencies for faster runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright
        run: |
          playwright install --with-deps chromium
          
      - name: Download Crawl4AI Models
        run: |
          crawl4ai-download-models || true

      - name: Run Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: redis://localhost:6379/0
          # Add any other required keys below, ensuring they are saved in GitHub Secrets
          ENABLE_LLM: "true" 
        run: |
          python scripts/run_github_ingestion.py
