name: Scheduled Ingestion Pipeline

# The schedule is switched off while the project is paused. Ingestion still
# runs on demand from the Actions tab, and re-enabling it is a matter of
# uncommenting the cron below.
#
# Leaving it running would keep writing to the database and spending Gemini
# free-tier quota for a feed nobody is reading.
on:
  # schedule:
  #   # Sources carry their own staggered cron windows and are only picked up
  #   # when due, so this just needs to tick often enough to catch them.
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

# A long run must never overlap the next tick: two runs ingesting at once
# would race on deduplication and double up stories.
concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Playwright and Chromium were only ever needed by the government portal
      # crawlers. Now that ingestion is RSS plus article extraction over
      # curl_cffi, the browser install is gone and runs start far faster.
      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          uv pip install --system -r requirements.txt
          uv pip install --system -e .

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      # Ingestion reads its work list from the database, so the registry
      # defined in code has to be reconciled into it first.
      - name: Sync sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python scripts/sync_sources.py

      - name: Run Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: redis://localhost:6379/0
          ENABLE_LLM: "true"
          PYTHONPATH: .
        run: python scripts/run_github_ingestion.py
